[package]
name = "lattice-maintenance"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Local computer interface for selecting and updating Lattice vertices"
repository = "https://github.com/zacharytomlinson/lattice-tools"

[dependencies]
lattice-peer.workspace = true
axum = "0.8.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync"] }
tokio-stream = { version = "0.1", features = ["sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
